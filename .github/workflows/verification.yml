name: Verification
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cxx: g++-14
            shell: bash
          - os: macos-14
            cxx: g++-15
            shell: bash
          - os: windows-2022
            cxx: g++
            shell: 'msys2 {0}'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: frankonstone/mcutest
          ref: 532327858ead93140535b539cf65b35eb96fdf01
          path: _ci/mcutest
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends g++-14 cmake ninja-build python3
      - if: runner.os == 'macOS'
        run: brew install gcc@15 cmake ninja python
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-python
      - name: Configure native, header and consumer checks
        shell: ${{ matrix.shell }}
        run: cmake --preset host -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DMCUBSP_MCUTEST_SOURCE_DIR="$PWD/_ci/mcutest"
      - name: Build and test without cross compilers or MCUIP
        shell: ${{ matrix.shell }}
        run: cmake --build --preset host --parallel 2
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.os }}
          path: |
            output/build/host/artifact/
            output/build/host/Testing/Temporary/LastTest.log
            output/build/host/CMakeCache.txt
  arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        board: [arduino-uno-r4-minima, st-nucleo-h753zi]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Provision Arm GNU 15.2.Rel1
        run: |
          curl --fail --location --retry 3 --output /tmp/arm-toolchain.tar.xz https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz
          echo '597893282ac8c6ab1a4073977f2362990184599643b4c5ee34870a8215783a16  /tmp/arm-toolchain.tar.xz' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/arm-toolchain"
          tar -xJf /tmp/arm-toolchain.tar.xz --strip-components=1 -C "$RUNNER_TEMP/arm-toolchain"
          echo "$RUNNER_TEMP/arm-toolchain/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --no-install-recommends cmake ninja-build
      - name: Link Blink with supplied startup
        run: |
          cmake --preset ${{ matrix.board }}
          cmake --build --preset ${{ matrix.board }} --target firmware --parallel 2
      - name: Build the external application starter through the public interface
        run: |
          if [ '${{ matrix.board }}' = arduino-uno-r4-minima ]; then board_id=arduino/uno_r4_minima; else board_id=st/nucleo_h753zi; fi
          cmake -S example/blink -B output/build/consumer -G Ninja -DMCUBSP_SOURCE_DIR="$PWD" -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/board-toolchain.cmake" -DMCUBSP_BOARD="$board_id"
          cmake --build output/build/consumer --target blink --parallel 2
      - name: Compile every header and architecture contracts
        run: |
          cmake -S test/compile/target -B output/build/probes -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/$(test '${{ matrix.board }}' = arduino-uno-r4-minima && echo toolchain-arm-cortex-m4.cmake || echo toolchain-arm-cortex-m7.cmake)" -DMCUBSP_CHECK_HEADERS=ON
          cmake --build output/build/probes --target check-compile --parallel 2
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware-${{ matrix.board }}
          path: |
            output/build/${{ matrix.board }}/src/board/firmware.elf*
            output/build/consumer/blink.elf*
            output/build/probes/barrier-report.txt
  esp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Link development-v1 firmware and check headers in ESP-IDF v6.1
        run: |
          docker run --rm -v "$PWD:/project" -w /project espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c sh -c 'cmake --preset waveshare-esp32p4-nano -DPYTHON="$(command -v python)" && cmake --build --preset waveshare-esp32p4-nano --target firmware --parallel 2 && cmake -S example/blink -B output/build/consumer -G Ninja -DMCUBSP_SOURCE_DIR=/project -DCMAKE_TOOLCHAIN_FILE=/project/cmake/board-toolchain.cmake -DMCUBSP_BOARD=waveshare/esp32p4_nano -DPYTHON="$(command -v python)" && cmake --build output/build/consumer --target blink --parallel 2 && cmake -S test/compile/target -B output/build/probes -G Ninja -DCMAKE_TOOLCHAIN_FILE=/project/cmake/toolchain-esp32p4.cmake -DMCUBSP_CHECK_HEADERS=ON && cmake --build output/build/probes --target check-compile --parallel 2'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware-esp32p4
          path: |
            output/build/waveshare-esp32p4-nano/src/board/firmware.elf*
            output/build/consumer/blink.elf*
            output/build/waveshare-esp32p4-nano/src/board/firmware-idf-build/flasher_args.json
            output/build/probes/barrier-report.txt
