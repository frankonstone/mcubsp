[project]
root = "."
requirements = [
  "requirements.md",
  "src/board/arduino/uno_r4_minima/requirements.md",
  "src/board/st/nucleo_h753zi/requirements.md",
  "src/board/waveshare/esp32p4_nano/requirements.md",
  "src/board/others/promicro_nrf52840/requirements.md",
]
plans = [
  "implementation-plan.md",
  "src/board/arduino/uno_r4_minima/implementation-plan.md",
  "src/board/st/nucleo_h753zi/implementation-plan.md",
  "src/board/waveshare/esp32p4_nano/implementation-plan.md",
  "src/board/others/promicro_nrf52840/implementation-plan.md",
]
sources = [
  "include/mcubsp/**/*.hpp",
  "example/**/*.cpp",
  "src/board/*/*/startup/**/*.?pp",
  "src/board/*/*/test/**/*.?pp",
  "src/board/*/*/startup/*.S",
]
build_files = [
  "CMakeLists.txt",
  "Install.cmake",
  "tool/*.py",
  "tool/*.cmake",
  "tool/*.sh",
  "test/**/CMakeLists.txt",
  "test/**/*.cmake",
  "cmake/**/*.cmake",
  "src/**/*.cmake",
  "src/**/CMakeLists.txt",
  "src/**/test/*.sh",
  "src/**/*.ld",
  "example/**/CMakeLists.txt",
]

# Native builds publish only reports in their explicit producer registry.
# The eight shared trace shards represent the latest successful native build.
# output/artifact/native.json remains the complete human/tool summary; importing
# bounded shards avoids the reader's fixed JSON arena without dropping cases.
# Historical physical records remain indexed in doc/acceptance, not imported
# as current-tree evidence. Run the host build before loading this graph.
[[artifacts]]
path = "output/artifact/native/0.json"
importer = "mcutest"

[[artifacts]]
path = "output/artifact/native/1.json"
importer = "mcutest"

[[artifacts]]
path = "output/artifact/native/2.json"
importer = "mcutest"

[[artifacts]]
path = "output/artifact/native/3.json"
importer = "mcutest"

[[artifacts]]
path = "output/artifact/native/4.json"
importer = "mcutest"

[[artifacts]]
path = "output/artifact/native/5.json"
importer = "mcutest"

[[artifacts]]
path = "output/artifact/native/6.json"
importer = "mcutest"

[[artifacts]]
path = "output/artifact/native/7.json"
importer = "mcutest"

[validation]
fail_at_or_above = "error"
