[project]
root = "."
requirements = ["requirements.md"]
plans = ["implementation-plan.md"]
sources = [
  "include/mcuhw/**/*.hpp",
  "examples/**/*.cpp",
  "board/*/*/bsp/**/*.?pp",
  "board/*/*/tests/**/*.?pp",
  "board/*/*/bsp/*.S",
]
build_files = [
  "CMakeLists.txt",
  "cmake/**/*.cmake",
  "board/*/*/*.cmake",
  "board/**/CMakeLists.txt",
  "board/*/*/tests/*.sh",
  "board/**/*.ld",
  "tools/*",
  "tools/mcuhwlib/**/*.py",
]

[[artifacts]]
path = "build/host/artifacts/mcutest-native.json"
importer = "mcutest"

[[artifacts]]
path = "build/host/artifacts/mcutest-tooling.json"
importer = "mcutest"

[[artifacts]]
path = "build/uno-r4-minima/artifacts/mcutest-hardware.json"
importer = "mcutest"

[[artifacts]]
path = "build/uno-r4-minima/artifacts/mcuhw_uno_r4_minima_all_tests.mcucov.json"
importer = "mcucov"

[[artifacts]]
path = "build/uno-r4-minima/artifacts/mcuhw_uno_r4_minima_ethernet_mcuip_tests.json"
importer = "mcutest"

[[artifacts]]
path = "build/uno-r4-minima/artifacts/mcuhw_uno_r4_minima_ethernet_metrics.json"
importer = "mcutest"

[[artifacts]]
path = "build/uno-r4-minima/artifacts/mcuhw_uno_r4_minima_ethernet_metrics_fast6.json"
importer = "mcutest"

[[artifacts]]
path = "build/uno-r4-minima/artifacts/mcuhw_uno_r4_minima_ethernet_metrics_fast12.json"
importer = "mcutest"

[[artifacts]]
path = "build/uno-r4-minima/artifacts/mcuhw_uno_r4_minima_ethernet_link_recovery.json"
importer = "mcutest"

[[artifacts]]
path = "build/nucleo-h753zi/artifacts/mcuhw_nucleo_h753zi_native_peripherals.json"
importer = "mcutest"

[[artifacts]]
