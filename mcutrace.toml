[project]
root = "."
requirements = ["requirements.md"]
plans = ["implementation-plan.md"]
sources = [
  "include/mcuhw/**/*.hpp",
  "board/uno_r4_minima/**/*.?pp",
  "board/nucleo_h753zi/**/*.?pp",
  "board/*o*/startup.S",
  "board/esp32p4_nano/tests/*.cpp",
  "board/esp32p4_nano/baremetal_smoke/**/*_start.cpp",
]
build_files = [
  "CMakeLists.txt",
  "cmake/*.cmake",
  "board/**/*.ld",
  "tools/*",
]

[[artifacts]]
path = "build/host/artifacts/mcutest.json"
importer = "mcutest"

[[artifacts]]
path = "build/uno-r4-minima/artifacts/mcutest-hardware.json"
importer = "mcutest"

[[artifacts]]
path = "build/uno-r4-minima/artifacts/mcuhw_uno_r4_minima_all_tests.mcucov.json"
importer = "mcucov"

[[artifacts]]
path = "build/nucleo-h753zi/artifacts/mcuhw_nucleo_h753zi_native_peripherals.json"
importer = "mcutest"

[[artifacts]]
path = "build/nucleo-h753zi/artifacts/mcuhw_nucleo_h753zi_native_peripherals.mcucov.json"
importer = "mcucov"

[[artifacts]]
path = "board/esp32p4_nano/baremetal_smoke/build/artifacts/esp32p4_native_smoke.mcutest.json"
importer = "mcutest"

[[artifacts]]
path = "board/esp32p4_nano/baremetal_smoke/build/artifacts/esp32p4_native_smoke.trace.mcucov.json"
importer = "mcucov"

[validation]
fail_at_or_above = "error"
