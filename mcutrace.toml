[project]
root = "."
requirements = ["requirements.md"]
plans = ["implementation-plan.md"]
sources = [
  "include/mcubsp/**/*.hpp",
  "example/**/*.cpp",
  "src/board/*/*/startup/**/*.?pp",
  "src/board/*/*/test/**/*.?pp",
  "src/board/*/*/startup/*.S",
]
build_files = [
  "CMakeLists.txt",
  "Install.cmake",
  "tool/*.py",
  "tool/*.cmake",
  "tool/*.sh",
  "test/**/CMakeLists.txt",
  "test/**/*.cmake",
  "cmake/**/*.cmake",
  "src/**/*.cmake",
  "src/**/CMakeLists.txt",
  "src/**/test/*.sh",
  "src/**/*.ld",
  "example/**/CMakeLists.txt",
]

# The host build merges only reports in its explicit producer registry.
# Historical physical records remain indexed in doc/acceptance, not imported
# as current-tree evidence. Run the host build before loading this graph.
[[artifacts]]
path = "output/build/host/artifact/native.json"
importer = "mcutest"

[validation]
fail_at_or_above = "error"
