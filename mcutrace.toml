[project]
root = "."
requirements = ["requirements.md"]
plans = ["implementation-plan.md"]
sources = [
  "include/mcuhw/**/*.hpp",
  "board/*/*/example/**/*.cpp",
  "board/*/*/bsp/**/*.?pp",
  "board/*/*/test/**/*.?pp",
  "board/*/*/bsp/*.S",
]
build_files = [
  "CMakeLists.txt",
  "cmake/**/*.cmake",
  "board/*/*/*.cmake",
  "board/**/CMakeLists.txt",
  "board/*/*/test/*.sh",
  "board/**/*.ld",
  "tool/*",
  "tool/mcuhwlib/**/*.py",
]

[[artifacts]]
path = "build/host/artifact/mcutest-native.json"
importer = "mcutest"

[[artifacts]]
path = "build/host/artifact/mcutest-tooling.json"
importer = "mcutest"

[[artifacts]]
path = "build/uno-r4-minima/artifact/mcutest-hardware.json"
importer = "mcutest"

[[artifacts]]
path = "build/uno-r4-minima/artifact/mcuhw_uno_r4_minima_all_tests.mcucov.json"
importer = "mcucov"

[[artifacts]]
path = "build/uno-r4-minima/artifact/arduino.uno_r4_minima.test.ethernet_mcuip.json"
importer = "mcutest"

[[artifacts]]
path = "build/uno-r4-minima/artifact/arduino.uno_r4_minima.test.ethernet_metrics.json"
importer = "mcutest"

[[artifacts]]
path = "build/uno-r4-minima/artifact/arduino.uno_r4_minima.test.ethernet_metrics_fast6.json"
importer = "mcutest"

[[artifacts]]
path = "build/uno-r4-minima/artifact/arduino.uno_r4_minima.test.ethernet_metrics_fast12.json"
importer = "mcutest"

[[artifacts]]
path = "build/uno-r4-minima/artifact/arduino.uno_r4_minima.test.ethernet_link_recovery.json"
importer = "mcutest"

[[artifacts]]
path = "build/nucleo-h753zi/artifact/st.nucleo_h753zi.test.native_peripherals.json"
importer = "mcutest"

[[artifacts]]
path = "build/nucleo-h753zi/artifact/st.nucleo_h753zi.test.native_peripherals.mcucov.json"
